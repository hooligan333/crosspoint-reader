[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
version = 1.6.5

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
; missingInclude (project headers) is suppressed alongside missingIncludeSystem: on a
; fresh CI checkout cppcheck has no resolved include paths, so it reports every
; project header as missing (~400 information-level lines) and fails the job.
check_flags =
  --enable=all
  --check-level=exhaustive
  --suppress=missingIncludeSystem
  --suppress=missingInclude
  --suppress=unusedFunction
  --suppress=unmatchedSuppression
  --suppress=*:*/.pio/*
  ; The SDK is maintained separately; keep this check scoped to reader-owned code.
  --suppress=*:*/freeink-sdk/*
  ; Analyzer status output is not a source-code defect.
  --suppress=checkersReport
  --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# SdFat transfers SPI a byte at a time on ESP32: SdFatConfig.h defaults
# USE_SPI_ARRAY_TRANSFER to 0 for every target but RP2040 and the UNO R4, and each
# Arduino transfer(uint8_t) writes the data register, starts the transfer and spins.
# 1 routes through transfer(buf, count) -> transferBytes() -> spiTransferBytesNL(),
# which batches into the SPI FIFO: ~3x on SD reads, at the cost of a 512-byte stack
# buffer on the send path. Inert on SDMMC boards, which bypass SdFat's SPI driver.
  -DUSE_SPI_ARRAY_TRANSFER=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
# FreeInkFont optional FreeType modules. The auto-hinter (~50KB text, PSRAM
# boards only via the vector-font gate) is REQUIRED by the BW-aware 2-bit
# quantizer in TtfEpdFont: with the ink threshold at 50% coverage, unhinted
# thin strokes that straddle pixel columns drop below threshold and break up;
# Light hinting snaps stems to full-coverage pixels so they survive. (An
# earlier "no improvement" A/B was confounded by the old always-ink quantizer
# flooding the differences.) Still OFF: the B/W raster (_MONOCHROME, ~5KB) is
# dead while every TtfEpdFont::load() is 2-bit; psnames (_PSNAMES, ~64KB)
# only serves glyph-NAME lookups a codepoint-driven renderer never makes;
# gzip (_GZIP, ~13KB) only decompresses .gz/WOFF, and the registry accepts
# .ttf/.otf/.ttc.
  -DFREEINK_FONT_ENABLE_AUTOHINT=1
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
# MEMFIX-PORT: single-precision ECC (sp_c32.c). Without it every P-256 operation
# (TLS 1.3 key_share keygen, ECDHE, ECDSA cert verify) runs on fast-math bignums
# that WOLFSSL_SMALL_STACK heap-allocates at FP_MAX_BITS size -- tens of KB of
# temporaries, which OOMs (MP_MEM) at the ~50KB free heap a reading session
# leaves. SP uses fixed 256-bit arrays: a few KB, and several times faster.
# SP_SMALL trades the large precomputed point tables for smaller flash.
  -DWOLFSSL_HAVE_SP_ECC
  -DWOLFSSL_SP_SMALL
# Arduino-wolfSSL's user_settings.h enables TLS extensions, supported curves,
# HKDF, and RSA-PSS when WOLFSSL_TLS13 is set. Do not repeat those defines here:
# GCC reports every library translation unit as a macro redefinition.
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DHAVE_SNI
# RFC 6066 max_fragment_length: SecureClient asks the peer for 2KB TLS records
# so the receive path never needs the default ~17KB contiguous buffer -- the
# MEMORY_E mid-download failure at the ~20KB free heap font downloads leave.
# Servers that ignore the extension keep 16KB records and behave as before.
  -DHAVE_MAX_FRAGMENT
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

; UI languages compiled into the firmware, as comma-separated codes from lib/I18n/translations
; (e.g. "en,de,fr"). English is always included. Languages left out are not offered in the
; language picker; a device whose saved language is not built in falls back to English.
custom_i18n_builtin_langs = all

extra_scripts =
  pre:scripts/patch_pioarduino_cache.py
  pre:scripts/patch_wolfssl.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  post:scripts/register_unit_tests_target.py
  post:scripts/patch_arduino_rom_libc.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  UsbMassStorage=symlink://freeink-sdk/libs/hardware/UsbMassStorage
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  MemoryManager=symlink://freeink-sdk/libs/hardware/MemoryManager
  FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  Imu=symlink://freeink-sdk/libs/hardware/Imu
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  ; Standalone FreeType/stb TTF engine backing lib/EpdFont/TtfEpdFont (runtime
  ; .ttf/.otf rendering). Vendors only stb_truetype + FreeType (no expat), so it
  ; does not hit the FreeInkBook duplicate-XML_* symbol problem.
  FreeInkFont=symlink://freeink-sdk/libs/font/FreeInkFont
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  wolfssl/Arduino-wolfSSL @ 5.7.2

lib_ignore =
  BLE

; The standard firmware profiles reclaim heap by rebuilding the Arduino core.
; USB-OTG (FREEINK_CAP_USB_MSC) profiles like the X4 Pro and Paper Mono
; intentionally do not inherit this section: they need PioArduino's complete
; prebuilt TinyUSB component graph, which the custom core rebuild omits.
[firmware_tuned]
; MEMFIX-PORT: custom_sdkconfig heap reclamation (~32-37 KB). Rebuilds the
; Arduino core libs on first build (slower once, cached after; needs the CMake
; pin in platformio.local.ini on macOS).
;
; If an interrupted rebuild fails with "multiple definition of 'app_main'"
; (stale generated scaffold), clean it up with:
;   rm -rf .dummy CMakeLists.txt sdkconfig.default sdkconfig.defaults .pio/build/default
; Do NOT use `git clean -fdX` — it deletes platformio.local.ini.
custom_sdkconfig =
  ; Task stack right-sizing from measured high-water marks (heap block map +
  ; per-task stack audit, July 2026): esp_timer used ~0.8 KB of 8 KB across
  ; every capture; the FreeRTOS timer service used ~0.5 KB
  ; of 4 KB. Neither runs TLS or app code. ~7 KB back to the heap.
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  ; Move the WiFi stack's non-critical hot paths out of IRAM into flash.
  ; On the C3, IRAM and DRAM share one SRAM pool, so the ~25-30 KB this
  ; frees lands directly in the heap — paid for with lower WiFi throughput
  ; during transfers (occasional sync/OTA use, not streaming: acceptable).
  ; IRAM cost is static, so the heap gain applies even with WiFi off.
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  ; Keep the Arduino wrappers for the removed cloud components (below) out of
  ; the core source list; all other bundled libraries default to enabled.
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  ; ESP_SR (speech recognition) only exists in the S3 core; its wrapper includes
  ; ESP_I2S.h, which the isolated core rebuild can't resolve. Unused here anyway,
  ; so drop it or the sticky env fails to build.
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
  ; esp-modbus requires its API blocking limit to cover the response timeout.
  CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=10000

; Drop unused cloud components from the core rebuild. esp_insights/rainmaker
; require embedded server certs the lib builder can't generate
; ("https_server.crt.S not found"); this firmware uses none of them.
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/esp_schedule
  espressif/esp_rcp_update
  espressif/esp_secure_cert_mgr
  espressif/cbor

; Keep C3-specific defaults separate from the S3 firmware profiles.
[firmware_tuned_c3]
extends = firmware_tuned
custom_sdkconfig =
  ${firmware_tuned.custom_sdkconfig}
  ; Use ROM libc routines to preserve the C3's shared instruction/data RAM.
  CONFIG_LIBC_OPTIMIZED_MISALIGNED_ACCESS=n
  ; Match the configurable defaults from the Arduino 3.3.7 build.
  CONFIG_BT_NIMBLE_CRYPTO_STACK_MBEDTLS=y
  CONFIG_BT_NIMBLE_EXT_SCAN=y
  CONFIG_ESP_IPC_TASK_STACK_SIZE=1024
  CONFIG_ESP_RMAKER_WORK_QUEUE_TASK_STACK=4096
  CONFIG_ESP_WIFI_GCMP_SUPPORT=n
  CONFIG_FMB_MASTER_TIMEOUT_MS_RESPOND=3000
  CONFIG_FMB_QUEUE_LENGTH=20
  CONFIG_FMB_TCP_CONNECTION_TOUT_SEC=20


[env:default]
extends = base, firmware_tuned_c3
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2 ; Set log level to debug for development builds


[env:gh_release]
extends = base, firmware_tuned_c3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base, firmware_tuned_c3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base, firmware_tuned_c3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

; --- Xteink X4 (original, ESP32-C3) + RSS feed sync ---------------------------
; [env:gh_release] — the RELEASE C3 X4+X3 build, same board and same kernel
; (base + firmware_tuned_c3, the profile EVERY C3 env composes: it adds
; CONFIG_LIBC_OPTIMIZED_MISALIGNED_ACCESS=n to keep the C3's shared
; instruction/data RAM, a 1 KB IPC task stack, and the rest of the C3 block) —
; plus CROSSPOINT_RSS_SYNC. Owner-directed 2026-09-08
; for a SECOND X4, not the development unit: articles only, so
; CROSSPOINT_FLASHCARDS is deliberately NOT set here and no combo env is
; touched. Release-flavoured rather than default-flavoured because this image is
; handed to somebody who is not debugging it: no CROSSPOINT_WAIT_FOR_USB_SERIAL
; boot delay and LOG_LEVEL=1 (info) rather than debug.
;
; The flag list is REPEATED from [env:gh_release] rather than composed with
; ${env:gh_release.build_flags} — the same thing [env:gh_release_rc] and
; [env:slim] do, and here it is forced: this env needs its OWN
; CROSSPOINT_VERSION, and composing would emit gh_release's -D for that macro
; alongside it. Component builds harvest -D only and drop -U, and vendored TUs
; compile with -Werror, so the duplicate definition would be fatal (the caveat
; recorded in [x4pro_flags]). Composing can ADD a flag; it cannot OVERRIDE a
; value. Keep this list in step with [env:gh_release] if that one changes.
;
; The size budget here, as on every env, is the 6.25 MB app partition
; (partitions.csv app0/app1 = 0x640000), of which this image uses about 5.4 MB.
; (The S3 combo pair's old 0x1C0000 "IROM cliff" rule never applied to the C3,
; and was retired outright 2026-09-24 -- see IROM HISTORY in [combo_flags].)
;
; C3 ITEM CAP. RssParser defaults to 100 items and the combo (S3 + 8 MB PSRAM)
; envs keep that. This device has ~380 KB RAM, no PSRAM, and a heap a reading
; session leaves near 50 KB free and fragmented.
;
; The peak is buildRows(), where the parser's item vector and the activity's Row
; vector are both live. Per item, with sizes measured on this toolchain
; (sizeof(RssItem) 100, sizeof(Row) 88, sizeof(std::string) 24 / 15-byte SSO)
; and ~8 B of multi_heap overhead per allocation:
;
;   field lengths      per item   100 items   30 items
;   typical               496 B    49,600 B    14,880 B
;   every field at cap  1,000 B   100,000 B    30,000 B
;
; plus ~6-8 KB of expat and HTTP-client fixed cost. At 100 items the typical
; case alone already exceeds the free heap, and it asks for it in single
; contiguous blocks of 10,000 B (items) and 8,800 B (rows) — on a fragmented
; heap the block, not the total, is what fails first, and a failing reserve()
; aborts (see the guard in RssSyncActivity.cpp). At 30 items the same blocks are
; 3,000 B and 2,640 B and the worst case fits with room to spare. 30 rows is
; also about as many as is usable on a device with no touchscreen, paged with
; the ADC-ladder keys.
;   pio run -e x4-rss -t upload
[env:x4-rss]
extends = base, firmware_tuned_c3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  ; The -x4-rss suffix is what the About screen shows, so "which build is on
  ; this reader?" is answerable without a serial console. scripts/git_branch.py
  ; only injects a version for the env names 'default' and 'sticky', and
  ; HalSystem.cpp:137 does not compile without one.
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-x4-rss\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds
  -DCROSSPOINT_RSS_SYNC
  -DCROSSPOINT_RSS_MAX_ITEMS=30

; x4-flash: the full second-device image for the ORIGINAL C3 X4 (Erica's
; wife's reader) — x4-rss plus Anki-style flashcards, using the C3 variant
; paths (FLASHCARD_SPEC.md 7b): no-PSRAM small-memory deck/state handling
; (2000-card cap) and the RTC-less soft clock (SD-persisted epoch + feed
; Date-header time source). Added 2026-09-08. The x4pro combo pair is
; UNAFFECTED: all three flags below are off there and the flashcards flag
; there uses the Pro resident-index/RTC design unchanged.
[env:x4-flash]
extends = base, firmware_tuned_c3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-x4-flash\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds
  -DCROSSPOINT_RSS_SYNC
  -DCROSSPOINT_RSS_MAX_ITEMS=30
  -DCROSSPOINT_FLASHCARDS
  -DCROSSPOINT_FLASHCARDS_C3
  -DCROSSPOINT_SOFT_CLOCK

; --- Seeed Sticky — ESP32-S3R8, 3.97" 800x480 SSD1677 + GT911 touch -----------
; Different MCU family than the C3 envs (one binary per family). The SDK
; auto-enables CAP_TOUCH (GT911) and the BQ27220 gauge for this device. The
; N16R8 board definition enables octal PSRAM.
;   pio run -e sticky -t upload
[env:sticky]
extends = base, firmware_tuned
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2

[env:sticky-gh_release]
extends = base, firmware_tuned
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:sticky-gh_release_rc]
extends = base, firmware_tuned
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

; --- Xteink X4 Pro — ESP32-S3, 16MB flash / 8MB PSRAM, SSD1677 + GT911 --------
; The SDK profile supplies the X4 Pro pinout, display, touch controller, and
; capacitive Home key. USB Serial/JTAG is the normal USB personality so
; PlatformIO can monitor and flash the reader. USB Drive starts MSC only for
; that File Transfer activity, then reboots back to this default on exit.
;   pio run -e x4pro -t upload
; Shared flag lists: x4pro_flags.common is everything the x4pro env defines
; except the log level, the USB-serial wait, and the USB Drive capability
; (x4pro_flags.usb_msc, see below); combo_flags.features is the combo feature
; set. The combo envs compose the lists themselves rather than inheriting
; env:x4pro's build_flags, because a value override on an inherited define
; cannot work here: the component build harvests -D defines only, drops -U, and
; vendored TUs build with -Werror, so a duplicate definition is fatal.
[x4pro_flags]
; USB Drive (upstream #3203). Deliberately NOT part of `common`: the capability
; needs PioArduino's prebuilt dio_opi Arduino core, whose TinyUSB component is
; enabled for CDC and MSC, and the combo envs below rebuild the core from their
; own custom_sdkconfig (esp_pm + tickless idle), which omits it -- USBMSC.h then
; compiles to nothing and the SDK's UsbMassStorage fails to build. Same reason
; [env:x4pro] extends base rather than firmware_tuned. Everything behind
; FREEINK_CAP_USB_MSC defaults to 0 and is fully #if-guarded app-side, so the
; combo image simply has no USB Drive activity.
usb_msc =
  -DFREEINK_CAP_USB_MSC=1
  -DUSB_PRODUCT=\"CrossPoint_X4_Pro\"
  -DUSB_MANUFACTURER=\"CrossPoint\"

common =
  -DFREEINK_DEVICE_X4PRO=1
  -DBOARD_HAS_PSRAM
  ; Whole in-book images live in a PSRAM LRU across page turns instead of the
  ; internal-RAM slot that only survives one page render. Needs PSRAM.
  -DCROSSPOINT_PSRAM_IMAGE_CACHE
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-x4pro\"
  -DENABLE_SERIAL_LOG
  ; X4 Pro SD is native SDMMC (1-bit), mounted through SdFat's block-device API.
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  ; Page-turn and chapter-build SD elimination, all three PSRAM-funded:
  ; 16KB expat chunks instead of 1KB (16x fewer SD reads per chapter build),
  ; the idle prewarm's deserialized page kept for the forward turn that wants
  ; it, and a lazy whole-file PSRAM mirror of book.bin so spine/TOC lookups
  ; stop seeking the card.
  -DCROSSPOINT_PARSE_BUFFER_SIZE=16384
  -DCROSSPOINT_PAGE_CACHE
  -DCROSSPOINT_BOOKBIN_PSRAM
  ; Chapter pagination moves off the reader's loop and onto the idle second
  ; core, in exact page-count ticks under the same RenderLock, with a
  ; notification-driven idle wait so the task does not hold off light sleep;
  ; near a chapter end it also pre-loads the next spine's CACHED section so the
  ; forward boundary turn swaps it in instead of loading synchronously.
  -DCROSSPOINT_BG_BUILD_TASK
  -DCROSSPOINT_NEXT_SECTION_PREBUILD
  ; When that task has nothing left to build, it pre-decodes the images on the
  ; next few pages into their .pxc cache files, so the first view of an image
  ; page renders from cache (~100 ms) instead of stalling for a multi-second
  ; extract-and-decode. Requires CROSSPOINT_BG_BUILD_TASK: it IS that task's
  ; idle work.
  -DCROSSPOINT_BG_IMAGE_DECODE
  ; Adds "Toggle Light" to the Short Power Button Click options: one press
  ; blacks out the frontlight + night mode and the next restores exactly the set
  ; that was on. Inert unless the user picks it; the flag only surfaces the
  ; choice.
  -DCROSSPOINT_PWR_TOGGLE_LIGHT

[combo_flags]
features =
  -DCROSSPOINT_AUTO_LIGHT_SLEEP
  -DFREEINK_FRONTLIGHT_LS
  -DCROSSPOINT_TOUCH_INT_WAKE
  -DFREEINK_GT911_INT_WAKE
  ; EXPERIMENT: exclude the panel drivers this unit can never reach.
  -DFREEINK_DRIVER_SSD1677=0
  -DFREEINK_DRIVER_UC8279_X4=0
  ; EXPERIMENT: SSD1677-only driver tuning flags dropped with that driver.
  ;-DFREEINK_X4PRO_FAST_DU_SHORTCUT
  ;-DFREEINK_X4PRO_RAIL_POWEROFF_SHORTCUT
  ; Stretch the bg build task's parked fallback to match ~1 s sleep windows.
  ; Hardware-validated 2026-08-19: 1.85 sleeps/s vs 4.5 baseline, 0 rejects.
  -DCROSSPOINT_BG_IDLE_STRETCH_MS=1000
  ; Pin the 48 KB framebuffer to internal SRAM (SDK flag): under SPIRAM_USE_MALLOC
  ; it otherwise lands in octal PSRAM, 4-9x slower on the hottest read-modify-write
  ; paths. Internal-first, plain-malloc fallback (logged if it fires). The async
  ; shadow is also covered, but single-buffer mode never allocates one, so the
  ; net internal cost on this firmware is 48 KB, not 96.
  -DFREEINK_FB_INTERNAL
  ; 40 MHz SDMMC instead of the mislabelled 20 MHz default (SDK flag), ~2x
  ; sequential throughput. Reads hardware-validated 2026-08; the write-integrity
  ; soak (~50 MB File-Transfer round-trip + byte-compare) is still outstanding.
  -DFREEINK_X4PRO_SDMMC_HS
  ; Keep decompressed builtin glyph groups resident in PSRAM for the session, so
  ; group DEFLATE costs once per session instead of ~30-100 ms per page turn.
  -DCROSSPOINT_RESIDENT_FONT_GROUPS
  ; Raise SdCardFont's advance-metadata cap from 768 (a ~380 KB C3 bound) so CJK
  ; layout stops falling back to per-glyph SD reads once the table fills.
  -DCROSSPOINT_SDFONT_ADVANCE_LIMIT=8192
  ; RSS feed sync: Home gains "Sync RSS Feed" and Settings > System gains
  ; "Configure RSS Feed". The device fetches a personal LAN RSS 2.0 feed over
  ; plain http, shows one checkbox row per <item>, and mirrors the ticked set
  ; into the destination folder — downloading the ready-made .epub each
  ; <enclosure> points at, and deleting (with its reading cache) the file of
  ; any row the user unticks. Files the feed does not mention are never
  ; touched.
  ;
  ; Costs ~12.2 KB of IROM (~7.5 KB activity, ~2.3 KB settings screen, ~1.9 KB
  ; parser, rest plumbing), measured when it landed. It was held off for a while
  ; by the since-retired 0x1C0000 "IROM cliff" rule -- see IROM HISTORY at the
  ; end of this section.
  -DCROSSPOINT_RSS_SYNC
  ; Flashcards (spaced repetition, FSRS-6). Home gains "Sync Decks" and
  ; Settings > System gains "Configure Deck Feed": the device fetches a second
  ; personal LAN RSS 2.0 feed over plain http whose <enclosure>s are ready-made
  ; CPDK v1 deck files (the PC converter does all Anki-format work), mirrors the
  ; ticked set into /Decks exactly as the RSS flow mirrors epubs, and deletes an
  ; unticked deck together with its scheduling state file. A completed download
  ; is CPDK-header-checked before it is renamed into place, and a deck that is
  ; already present is re-downloaded when the feed's guid advertises a content
  ; hash the local header does not match -- decks are mutable, and the .state
  ; file survives the replacement. Round 3 adds the study session itself:
  ; FlashcardStudyActivity (deck picker, mode select, review loop with the four
  ; FSRS grade buttons, one-deep undo, suspend, done screen), the CPST state
  ; file + queue builder in src/flashcards, and lib/FsrsSched, which nothing
  ; linked before this round.
  ;
  ; Combo-only, like every flag in this section, and default-off everywhere
  ; else: whole-file #ifdef guards, so with the flag off every new translation
  ; unit compiles to nothing. Re-verified on [env:default] and [env:x4pro] for
  ; round 3: zero Flashcard*/fsrs::/flashcards:: symbols are linked in either
  ; ([env:default] IROM 0x1f2288). The i18n string tables still grow
  ; unconditionally for every build -- 28 new keys this round on top of R2's
  ; eight, at the ~92 B/key rate R2 measured -- all of it DROM.
  ;
  ; Size, measured as each round landed (esptool image_info, IROM segment):
  ; round 2 (the fetch half) ~12.5 KB; round 3 (the study session) ~24.0 KB --
  ; FlashcardStudyActivity 8.8 KB, src/flashcards (DeckFile, StateStore,
  ; SessionQueue) 6.8 KB, lib/FsrsSched 2.8 KB, newly linked libm float
  ; (__ieee754_powf, expf and wrappers) 2.6 KB, plumbing + literal pools
  ; ~2.9 KB; then ~5.5 KB more for CPDK v2 card images (JPEGDEC is reused from
  ; [base] lib_deps, so no codec cost). The flag spent a while over the
  ; since-retired 0x1C0000 "IROM cliff" rule; see IROM HISTORY at the end of
  ; this section.
  -DCROSSPOINT_FLASHCARDS
  ; Allocation gates measure malloc-visible internal RAM ({DEFAULT|INTERNAL})
  ; instead of bare INTERNAL; on this env's current malloc policy (no reserve
  ; pool) the practical delta is small — it is correctness plumbing that makes
  ; the deferred SPIRAM-policy step safe.
  -DCROSSPOINT_PSRAM_HEAP_GAUGE
  ; Dead-code trim (2026-09-08): the Arduino core's RGB-LED helper and the whole
  ; RMT driver stack behind it are dropped from the link. The flag activates the
  ; stub definitions in src/platform/no_rgb_led.c, which preempt extraction of
  ; libFrameworkArduino.a(esp32-hal-rgb-led.c.o) -- the only thing that
  ; references esp32-hal-rmt.c.o, which is the only thing that references
  ; libesp_driver_rmt.a. That TU's comment carries the full chain; the measured
  ; figures (the lasting one is ~3.7 KB of IRAM back to the heap) are in IROM
  ; HISTORY below. THESE ENVS ONLY: no source
  ; behaviour changes (the one caller is an unreachable RGB_BUILTIN branch in
  ; __digitalWrite), and there is no RGB LED on this board. NOT an sdkconfig
  ; change -- the kernel is untouched; libesp_driver_rmt.a simply stops being
  ; pulled out of the prebuilt library set. Remove this line to restore it.
  -DCROSSPOINT_NO_RGB_LED
  ; Image pages stop forcing a clean (flashing) base refresh on the NEXT page.
  ; Measured on a UC8179 X4 Pro: the forced HALF base costs 1491 ms of a ~1.8 s
  ; image page turn (the grayscale pass itself is only 296 ms), because HALF and
  ; FULL both run the panel's OTP GC waveform at TSSET 0x1E while FAST runs the
  ; 559 ms partial. The UC8179 driver already substitutes stock's non-flashing
  ; XTF_PRE_BW_MID previous->current transition for any FAST paint that follows
  ; grayscale, which re-drives the gray charge per pixel — so the clean is
  ; redundant there. Gated at runtime on the mode-bound driver capability
  ; (fastAfterGrayscaleSafe(Overlay)), so SSD1677 and every other panel keep
  ; today's path; the periodic ghost-clear still fires on the normal SETTINGS
  ; refresh cadence. Upstream #3478's absolute image path does NOT subsume this:
  ; it is gated on Controller::UC8279, and this device is UC8179.
  -DCROSSPOINT_IMG_NO_FORCED_CLEAN
  ; UC8179 rail power-off. The panel's analog rails (booster, VGH/VGL, VSH/VSL,
  ; VCOM) otherwise latch ON at the first refresh and stay on for the entire
  ; reading session: displayGray() discards turnOff for stock parity and nothing
  ; on this device passes turnOff=true. The SDK's controllerIdle()/
  ; beginDisplayWork() hooks are the designed vehicle and had zero callers.
  ; main.cpp parks the rails on the same 3 s inactivity threshold as the CPU
  ; power saving, and ActivityManager prewarms them on the render-queue edge —
  ; every requestUpdate(), so timer/background/USB renders get the ramp too — so
  ; the measured 127 ms PON ramp overlaps CPU-side page composition. SSD1677-class
  ; prior for the saving: ~1-3 mA latched vs ~25-40 uA off. NEEDS A METER on
  ; this silicon — no UC8179 rail current figure exists anywhere.
  -DFREEINK_UC8179_RAIL_POWEROFF
  ; UC8179 lean plane streams, ~55-70 ms off every anti-aliased page turn: the
  ; OLD-plane restore at the end of the base transition becomes lazy (the AA
  ; upload overwrote it on every reading page), the NEW-plane restore after the
  ; gray activation is dropped (every path that can follow it re-streams DTM2
  ; before use), and the 120 non-visible gate padding rows go out as one SPI
  ; burst instead of 120 separate transactions. Byte-identical wire content.
  -DFREEINK_UC8179_LEAN_STREAMS
  ; Kill the text-over-image ghost. The UC8179 gray-exit transition
  ; (XTF_PRE_BW_MID) drives a was-white->black pixel for 25 saturating frames but
  ; gives a was-black->black pixel only the 4-frame KK corrective, so black ends
  ; up at two depths — and the AA waveform's gray drive is ~2 frames off black.
  ; The result is the OUTGOING page's text pattern surviving as density variation
  ; inside the INCOMING page's grays, which is invisible on a text page and very
  ; visible on a photo. Running the same precondition a second time with
  ; DTM1 == DTM2 fires only the uniform KK/WW correctives and equalizes black
  ; depth before the gray planes land. Hardware-validated by the user as a fix.
  ; It costs a second full activation (~666 ms), so it is NOT unconditional: the
  ; driver exposes a one-shot requestDeepGrayEqualize() hint and the reader arms
  ; it only on the image-page branch, leaving text page turns untouched.
  -DFREEINK_UC8179_DOUBLE_GRAY_PRE
  ; Class-scoped block styling with left-border rules. The CSS engine already
  ; matched `element.class` selectors and already honoured padding-left, the
  ; 4-value margin shorthand and font-style, so what this adds is the one
  ; property that was silently dropped: border-left. A block that declares one
  ; records a vertical rule, and every rendered line of that block and of its
  ; descendants draws one rule per bordered ancestor down the left edge — so a
  ; nested-<blockquote> comment tree (the shape the RSS server emits for Hacker
  ; News threads) renders as stacked thread lines instead of flat text, at a
  ; per-level inset of margin-left + border + padding-left rather than a
  ; browser's 40px, keeping nearly full text width at depth.
  ; Carries the cache-format changes too, which is what keeps a build without the
  ; flag byte-identical: the cost is that the combo envs rebuild their section and
  ; CSS caches once on first flash.
  ;
  ; VERSION NUMBERING (r4; replaces r3's "flagged = upstream + 1"):
  ;   flags-off = upstream's number exactly (CSS 12, SECTION 46)
  ;   flagged   = upstream's number + 100 (CSS 112, SECTION 146), a reserved band
  ;               upstream's one-at-a-time march will not reach for decades. The
  ;               partial-section sentinel stays formula-derived, 0xFE - (V - 28):
  ;               flags-off 236, flagged 136 -- disjoint from each other, from every
  ;               full version either side writes, and from the r3-era 44/45/237/238.
  ; "+1" was retired because it walks the flagged number through upstream's own
  ; space one rebase behind, so a later flags-off number lands on an earlier flagged
  ; one. It already had: r3's flagged CSS version was 12 (upstream 11 + 1) with
  ; 71-byte style records, and r4's flags-off number is upstream's own 12 with
  ; 67-byte records -- one byte for two layouts, which the version gate cannot
  ; separate (r3-written caches are still rejected, but downstream by payload
  ; validation rather than by the gate). On the section side the collision was
  ; imminent rather than historical: upstream took 44 -> 45 -> 46 inside one rebase
  ; window, so its next bump is 47 -- exactly the number r3's rule had handed the
  ; flagged build. Any future rebase: leave flags-off on upstream's number and keep
  ; flagged at +100; do not re-derive "+1".
  ;
  ; Costs ~1.5 KB of IROM (~570 B CSS parser, ~400 B the per-line border
  ; table's serialization, ~370 B the chapter parser's inlined combine, rest
  ; render + plumbing), measured when it landed.
  -DCROSSPOINT_CSS_CLASS_RULES
  ; Usage log: /.crosspoint/usage.csv gains one row per BOOT, SLEEP, page turn,
  ; and frontlight / night-mode / WiFi toggle, each stamped with battery percent,
  ; millivolts and the charging flag, so usage and battery statistics can be
  ; computed off-device. Events buffer in a 32-entry static ring (384 B, no heap
  ; on the event path) and are flushed from loop(); the page-turn path touches
  ; neither SD nor I2C, and the wall clock is read once per flush rather than
  ; per event. Rotates at 4 MB. See src/UsageLog.h for the event list, the aux
  ; encoding and the single-task contract.
  ;
  ; Costs ~2.2 KB of IROM, measured when it landed. The date maths is
  ; deliberately integer-only: mktime() + localtime_r() cost ~1.6 KB more for a
  ; column the log wants as raw RTC time.
  ;
  ; PROFILING EVENTS (later extension, same flag). The row gains a `detail`
  ; column (Entry 12 -> 16 B, ring still 32 = 512 B static) and new event kinds
  ; aimed at power and load-time statistics: FR (non-FAST refresh
  ; requests), BOOK_OPEN/BOOK_RDY (book load time, cold vs stale vs warm),
  ; CH_START/CH_RDY (chapter load time, prebuilt vs on demand), CHG_ON/CHG_OFF
  ; (charge sessions, so battery stats can exclude them) and LS/LSN (light-sleep
  ; residency and wake count at sleep entry, pmstats builds only). Refreshes are
  ; COUNTED, not hooked: they are issued from the render task while the ring is
  ; loop-task only, so HalDisplay bumps a lock-free atomic where every
  ; RefreshMode is converted and tick() drains it into one FR row per poll. Same
  ; discipline as the original: no SD/I2C/RTC on any hot path, no new formatting
  ; machinery.
  ;
  ; ADVERSARIAL REVIEW FIXES (2026-09-03), same flag: stamp every
  ; frame-painting path in the EPUB reader so a pending _RDY cannot be answered
  ; by an unrelated later frame (plus a 90 s deadline that drops it instead), a
  ; BOOK_OPEN that distinguishes a stale cache (book.bin present but the wrong
  ; format version, which rebuilds exactly like a cold open) from a warm one,
  ; automatic rotation of an old-schema usage.csv, a 3-sample debounce on the
  ; CHG edges, and the LSN wake-count row. The cold/stale/warm probe
  ; deliberately uses openFileForRead plus a one-byte read rather than
  ; Storage.readFileToBuffer(): the latter has no other caller in the image, so
  ; reaching for it would link that function and its HAL wrapper (176 B) for
  ; nothing.
  -DCROSSPOINT_USAGE_LOG
  ; Home-key tap = Go Back (2026-09-15). Upstream #3516 landed its own Home-key
  ; shortcut system (tap / double tap / long press, each bound to a
  ; HomeButtonAction) and the fork's parallel #3224 stack was dropped in its
  ; favour during the r4 rebase. This flag re-adds the one thing #3516 has no
  ; equivalent for: a "Go Back" action that climbs ONE activity level instead of
  ; jumping all the way to the home screen -- issue #3067's ask, and the fork's
  ; long-standing default. It appends HomeButtonAction::GoBack (last, behind the
  ; flag, so persisted indices are untouched), makes it the tap default, and
  ; brings the result-safety the fork's own review found the first time round:
  ; an external pop must not hand a std::monostate ActivityResult to a parent
  ; handler that std::get<>s an alternative, which under -fno-exceptions is a
  ; panic reboot. It does that by DELIVERING a cancelled result rather than
  ; skipping the dispatch: every result handler in the tree already has a cancel
  ; branch, and that branch is the cleanup an abandoned child needs (reopen the
  ; library index, reset the WiFi wizard, rebuild the OPDS row vector, re-read
  ; the bookmark cache). Skipping instead stranded 17 parent screens in states
  ; their own loop() does not handle. Flags-off is byte-identical upstream: the
  ; enum value, the label, the dispatch and the default are all inside the
  ; guard, and a settings.json carrying the flagged index clamps back to the
  ; field default because fromJson() bounds ENUM rows by
  ; home_button::ACTION_LABELS' size.
  ;
  ; TWO THINGS THE "default" WORD DOES NOT COVER:
  ; * It is the STRUCT-INITIALIZER default, so it reaches only a device whose
  ;   settings.json has no homeButtonTapAction key yet. Any device that has
  ;   already round-tripped its settings (or where the user has ever picked a
  ;   value) keeps the stored one; existing devices do NOT silently change
  ;   behaviour on flashing this.
  ; * With tap = GoBack, wasHomeGesture() (homeAction == Home on a home-key
  ;   board) is never true from a tap, so NO gesture is bound to Home on the
  ;   combo defaults (tap = GoBack, double tap = ToggleFrontlight, long press =
  ;   ReaderMenu). Repeated GoBack still reaches Home, via the
  ;   stackActivities.empty() -> goHome() path. Code that means "the user asked
  ;   to leave this screen" must therefore test homeButtonAction() != Ignore,
  ;   not wasHomeGesture() -- see the two transfer pumps.
  -DCROSSPOINT_HOME_TAP_GO_BACK
  ;
  ; --- IROM HISTORY (the 0x1C0000 "cliff" rule, retired 2026-09-24) ------
  ; From 2026-08-20 to 2026-09-24 every combo change was gated on the IROM
  ; segment staying below 0x1C0000, on the belief that the OEM bootloader could
  ; not map a larger image. That belief is DISPROVEN: the OEM bootloader is
  ; stock ESP-IDF v6.0.1, which invalidates the MMU and maps DROM and IROM
  ; linearly with no page-dependent path, and the 2026-08-20 boot failures
  ; trace to builds corrupted during that week's disk-full (ENOSPC) window. Full
  ; analysis: x4pro-program/CONTEXT.md, the "2026-09-24 (bootloader analysis)"
  ; entry. The size limit that is real is the app slot in partitions.csv
  ; (app0/app1 = 0x640000), which bounds the TOTAL image, not one segment.
  ;
  ; The per-feature measurement tables and the ranked lever ledger that used to
  ; live here are in git history (and x4pro-program/r4-irom-menu.md,
  ; r4-package-a-notes.md). The levers that cost something real (src/ canaries,
  ; jump tables, mDNS, newlib-nano, silent assertions, no coredump,
  ; LOG_LEVEL=0) were reverted in the same series that retired the rule; what
  ; follows is the knowledge worth keeping.
  ;
  ; MEASURING SIZE: take the segments from the freshly linked firmware.elf
  ; (esptool elf2image + image_info; IROM loads at 0x42000020, match by
  ; address, the segment NUMBER shifts), never from .pio/build/*/firmware.bin,
  ; which the build cache can restore stale. A combo build that does not log
  ; "Copied compiled esp32s3 IDF libraries" linked the previous env's core libs
  ; and is not a valid measurement.
  ;
  ; CssParser from_chars -> strtof (2026-09-08, lib/, so every env): the one
  ; std::from_chars(..., float&) call linked libstdc++'s whole
  ; floating_from_chars.o (fast_float, hex-float and inf/nan readers, a 10 KB
  ; power-of-five table). It now goes through a local parseDecimalFloat() that
  ; scans the number itself and converts a rebuilt digits-only copy with
  ; newlib's strtof(); the integer from_chars() in interpretFontWeight() is
  ; untouched. ~8.4 KB IROM and ~12.2 KB DROM on every env. strtof() never sees
  ; caller text, so its hex-float/inf/nan/whitespace extensions cannot fire;
  ; the one divergence from from_chars() is that exponents ("1e3") are not
  ; accepted, which tryInterpretLength()'s split already guarantees. 11M+ host
  ; cases matched std::from_chars bit-for-bit on everything the tokeniser can
  ; deliver. The helper's comment block in CssParser.cpp carries the full
  ; contract.
  ;
  ; RMT / RGB-LED link chain (2026-09-08, CROSSPOINT_NO_RGB_LED above), read
  ; off the map's archive-member log:
  ;
  ;   esp32-hal-gpio.c.o      __digitalWrite() opens with an unconditional
  ;                           `if (pin == RGB_BUILTIN) rgbLedWrite(...)` branch
  ;     -> esp32-hal-rgb-led.c.o   (rmtInit / rmtWrite)
  ;       -> esp32-hal-rmt.c.o     (rmt_new_tx_channel, ...)
  ;         -> libesp_driver_rmt.a (rmt_tx, rmt_rx, rmt_common, rmt_encoder,
  ;                                 rmt_encoder_copy)
  ;           -> libhal.a(rmt_hal.c.o), libsoc.a(rmt_periph.c.o)
  ;
  ; Every step is a plain undefined-symbol reference, so defining the three
  ; rgbLed entry points in src/platform/no_rgb_led.c keeps the head member from
  ; being extracted and the whole tail never enters the link. There is NO
  ; sdkconfig switch for any of it: CONFIG_ARDUINO_SELECTIVE_* selects bundled
  ; libraries/ only, the two hal .c files are unconditional in the framework
  ; CMakeLists, and libesp_driver_rmt.a is a prebuilt IDF library. Took ~13.9 KB
  ; IROM, ~3.7 KB IRAM (the rmt ISRs are IRAM_ATTR -- that heap is the lasting
  ; win) and ~5.4 KB DROM. RESIDUAL RISK: digitalWrite() on RGB_BUILTIN, or a
  ; direct rgbLedWrite()/neopixelWrite(), silently does nothing on a combo
  ; build; there is no RGB LED on this board.
  ;
  ; NULL RESULTS on this toolchain (xtensa-esp-elf GCC 14.2.0, GNU ld 2.43.1),
  ; measured 2026-09-03 -- do not re-try them:
  ;   -Oz in place of -Os     0 B. GCC's -Oz has no Xtensa back-end effect:
  ;                           four real TUs compiled both ways produced
  ;                           byte-identical .text.
  ;   -fno-unwind-tables      0 B. .eh_frame is already empty under
  ;                           -fno-exceptions; there is nothing to remove.
  ;   -Wl,--icf=safe          Unsupported. The linker is GNU ld (bfd); identical
  ;                           code folding exists only in gold and lld.
  ;   -fno-reorder-blocks     -152 B over 8 TUs, and it is a speed regression.
  ;   -fno-devirtualize       -131 B over 8 TUs.
  ;   -fno-guess-branch-prob  +298 B (worse).
  ;   -fmerge-all-constants   0 B of .text (it moves 124 KB of DROM) and it is
  ;                           not conforming for C++.
  ; Audit null results from the same pass:
  ;   * The FREEINK_DRIVER_SSD1677=0 / FREEINK_DRIVER_UC8279_X4=0 exclusion
  ;     holds: no SSD1677, UC8279-X4 or SSD1683 object is linked; the only
  ;     panel drivers in .flash.text are Uc8179Driver and Ed2208M5Driver.
  ;   * There are no -O2 pockets. Every PlatformIO-built library compiles at
  ;     -Os, and no library.json in lib/, freeink-sdk/libs/ or .pio/libdeps/
  ;     overrides the optimisation level (the one extraScript, SDCardManager's
  ;     inject_build_flags.py, only injects USE_UTF8_LONG_NAMES).

[env:x4pro]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
; Use the prebuilt dio_opi Arduino variant: its TinyUSB component is enabled
; for CDC and MSC. This profile deliberately extends base rather than
; firmware_tuned, whose custom SDK rebuild omits that component.
build_flags =
  ${base.build_flags}
  ${x4pro_flags.common}
  ${x4pro_flags.usb_msc}
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2

; --- Xteink X4 Classic (X4C) ---------------------------------------------------
; Same ESP32-S3 board and display stack as the X4 Pro (SSD1677/UC8179/UC8279 auto-
; detected at boot) but buttons-only: no touchscreen and no frontlight, so the
; freed pins become four extra front buttons (two side page-turn keys + four bottom
; keys). Native 1-bit SDMMC + USB-MSC file transfer as on the X4 Pro; drops the
; frontlight flag. See freeink-sdk/docs/xteink-x4c-support.md.
;   pio run -e x4c -t upload
[env:x4c]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4CLASSIC=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_X4_Classic\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-x4c\"
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2
  ; X4C SD is native SDMMC (1-bit), mounted through SdFat's block-device API.
  -DUSE_BLOCK_DEVICE_INTERFACE=1

