[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
version = 1.5.0

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
; missingInclude (project headers) is suppressed alongside missingIncludeSystem: on a
; fresh CI checkout cppcheck has no resolved include paths, so it reports every
; project header as missing (~400 information-level lines) and fails the job.
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=missingInclude --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
# MEMFIX-PORT: single-precision ECC (sp_c32.c). Without it every P-256 operation
# (TLS 1.3 key_share keygen, ECDHE, ECDSA cert verify) runs on fast-math bignums
# that WOLFSSL_SMALL_STACK heap-allocates at FP_MAX_BITS size -- tens of KB of
# temporaries, which OOMs (MP_MEM) at the ~50KB free heap a reading session
# leaves. SP uses fixed 256-bit arrays: a few KB, and several times faster.
# SP_SMALL trades the large precomputed point tables for smaller flash.
  -DWOLFSSL_HAVE_SP_ECC
  -DWOLFSSL_SP_SMALL
# Arduino-wolfSSL's user_settings.h enables TLS extensions, supported curves,
# HKDF, and RSA-PSS when WOLFSSL_TLS13 is set. Do not repeat those defines here:
# GCC reports every library translation unit as a macro redefinition.
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DHAVE_SNI
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/patch_pioarduino_cache.py
  pre:scripts/patch_wolfssl.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  post:scripts/register_unit_tests_target.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  UsbMassStorage=symlink://freeink-sdk/libs/hardware/UsbMassStorage
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  Imu=symlink://freeink-sdk/libs/hardware/Imu
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  wolfssl/Arduino-wolfSSL @ 5.7.2

lib_ignore =
  BLE

; The standard firmware profiles reclaim heap by rebuilding the Arduino core.
; USB-OTG (FREEINK_CAP_USB_MSC) profiles like the X4 Pro and Paper Mono
; intentionally do not inherit this section: they need PioArduino's complete
; prebuilt TinyUSB component graph, which the custom core rebuild omits.
[firmware_tuned]
; MEMFIX-PORT: custom_sdkconfig heap reclamation (~32-37 KB). Rebuilds the
; Arduino core libs on first build (slower once, cached after; needs the CMake
; pin in platformio.local.ini on macOS).
;
; If an interrupted rebuild fails with "multiple definition of 'app_main'"
; (stale generated scaffold), clean it up with:
;   rm -rf .dummy CMakeLists.txt sdkconfig.default sdkconfig.defaults .pio/build/default
; Do NOT use `git clean -fdX` — it deletes platformio.local.ini.
custom_sdkconfig =
  ; Task stack right-sizing from measured high-water marks (heap block map +
  ; per-task stack audit, July 2026): esp_timer used ~0.8 KB of 8 KB across
  ; every capture; the FreeRTOS timer service used ~0.5 KB
  ; of 4 KB. Neither runs TLS or app code. ~7 KB back to the heap.
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  ; Move the WiFi stack's non-critical hot paths out of IRAM into flash.
  ; On the C3, IRAM and DRAM share one SRAM pool, so the ~25-30 KB this
  ; frees lands directly in the heap — paid for with lower WiFi throughput
  ; during transfers (occasional sync/OTA use, not streaming: acceptable).
  ; IRAM cost is static, so the heap gain applies even with WiFi off.
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  ; Keep the Arduino wrappers for the removed cloud components (below) out of
  ; the core source list; all other bundled libraries default to enabled.
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  ; ESP_SR (speech recognition) only exists in the S3 core; its wrapper includes
  ; ESP_I2S.h, which the isolated core rebuild can't resolve. Unused here anyway,
  ; so drop it or the sticky env fails to build.
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n

; Drop unused cloud components from the core rebuild. esp_insights/rainmaker
; require embedded server certs the lib builder can't generate
; ("https_server.crt.S not found"); this firmware uses none of them.
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/esp_schedule
  espressif/esp_rcp_update
  espressif/esp_secure_cert_mgr
  espressif/cbor

[env:default]
extends = base, firmware_tuned
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2 ; Set log level to debug for development builds


[env:gh_release]
extends = base, firmware_tuned
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base, firmware_tuned
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base, firmware_tuned
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

; --- Seeed Sticky — ESP32-S3R8, 3.97" 800x480 SSD1677 + GT911 touch -----------
; Different MCU family than the C3 envs (one binary per family). The SDK
; auto-enables CAP_TOUCH (GT911) and the BQ27220 gauge for this device; PSRAM is
; intentionally left off (48KB framebuffer fits in DRAM, same as X4).
;   pio run -e sticky -t upload
[env:sticky]
extends = base, firmware_tuned
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2

[env:sticky-gh_release]
extends = base, firmware_tuned
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:sticky-gh_release_rc]
extends = base, firmware_tuned
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

; --- Xteink X4 Pro — ESP32-S3, 16MB flash / 8MB PSRAM, SSD1677 + GT911 --------
; The SDK profile supplies the X4 Pro pinout, display, touch controller, and
; capacitive Home key. USB Serial/JTAG is the normal USB personality so
; PlatformIO can monitor and flash the reader. USB Drive starts MSC only for
; that File Transfer activity, then reboots back to this default on exit.
;   pio run -e x4pro -t upload
; Shared flag lists: x4pro_flags.common is everything the x4pro env defines
; except the log level, the USB-serial wait, and the USB Drive capability
; (x4pro_flags.usb_msc, see below); combo_flags.features is the combo feature
; set. The combo envs compose the lists themselves rather than inheriting
; env:x4pro's build_flags, because a value override on an inherited define
; cannot work here: the component build harvests -D defines only, drops -U, and
; vendored TUs build with -Werror, so a duplicate definition is fatal.
[x4pro_flags]
; USB Drive (upstream #3203). Deliberately NOT part of `common`: the capability
; needs PioArduino's prebuilt dio_opi Arduino core, whose TinyUSB component is
; enabled for CDC and MSC, and the combo envs below rebuild the core from their
; own custom_sdkconfig (esp_pm + tickless idle), which omits it -- USBMSC.h then
; compiles to nothing and the SDK's UsbMassStorage fails to build. Same reason
; [env:x4pro] extends base rather than firmware_tuned. Everything behind
; FREEINK_CAP_USB_MSC defaults to 0 and is fully #if-guarded app-side, so the
; combo image simply has no USB Drive activity.
usb_msc =
  -DFREEINK_CAP_USB_MSC=1
  -DUSB_PRODUCT=\"CrossPoint_X4_Pro\"
  -DUSB_MANUFACTURER=\"CrossPoint\"

common =
  -DFREEINK_DEVICE_X4PRO=1
  -DBOARD_HAS_PSRAM
  ; Whole in-book images live in a PSRAM LRU across page turns instead of the
  ; internal-RAM slot that only survives one page render. Needs PSRAM.
  -DCROSSPOINT_PSRAM_IMAGE_CACHE
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-x4pro\"
  -DENABLE_SERIAL_LOG
  ; X4 Pro SD is native SDMMC (1-bit), mounted through SdFat's block-device API.
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  ; Page-turn and chapter-build SD elimination, all three PSRAM-funded:
  ; 16KB expat chunks instead of 1KB (16x fewer SD reads per chapter build),
  ; the idle prewarm's deserialized page kept for the forward turn that wants
  ; it, and a lazy whole-file PSRAM mirror of book.bin so spine/TOC lookups
  ; stop seeking the card.
  -DCROSSPOINT_PARSE_BUFFER_SIZE=16384
  -DCROSSPOINT_PAGE_CACHE
  -DCROSSPOINT_BOOKBIN_PSRAM
  ; Chapter pagination moves off the reader's loop and onto the idle second
  ; core, in exact page-count ticks under the same RenderLock, with a
  ; notification-driven idle wait so the task does not hold off light sleep;
  ; near a chapter end it also pre-loads the next spine's CACHED section so the
  ; forward boundary turn swaps it in instead of loading synchronously.
  -DCROSSPOINT_BG_BUILD_TASK
  -DCROSSPOINT_NEXT_SECTION_PREBUILD
  ; When that task has nothing left to build, it pre-decodes the images on the
  ; next few pages into their .pxc cache files, so the first view of an image
  ; page renders from cache (~100 ms) instead of stalling for a multi-second
  ; extract-and-decode. Requires CROSSPOINT_BG_BUILD_TASK: it IS that task's
  ; idle work.
  -DCROSSPOINT_BG_IMAGE_DECODE
  ; Adds "Toggle Light" to the Short Power Button Click options: one press
  ; blacks out the frontlight + night mode and the next restores exactly the set
  ; that was on. Inert unless the user picks it; the flag only surfaces the
  ; choice.
  -DCROSSPOINT_PWR_TOGGLE_LIGHT

[combo_flags]
features =
  -DCROSSPOINT_AUTO_LIGHT_SLEEP
  -DFREEINK_FRONTLIGHT_LS
  -DCROSSPOINT_TOUCH_INT_WAKE
  -DFREEINK_GT911_INT_WAKE
  ; EXPERIMENT: exclude the panel drivers this unit can never reach.
  -DFREEINK_DRIVER_SSD1677=0
  -DFREEINK_DRIVER_UC8279_X4=0
  ; EXPERIMENT: SSD1677-only driver tuning flags dropped with that driver.
  ;-DFREEINK_X4PRO_FAST_DU_SHORTCUT
  ;-DFREEINK_X4PRO_RAIL_POWEROFF_SHORTCUT
  ; Stretch the bg build task's parked fallback to match ~1 s sleep windows.
  ; Hardware-validated 2026-08-19: 1.85 sleeps/s vs 4.5 baseline, 0 rejects.
  -DCROSSPOINT_BG_IDLE_STRETCH_MS=1000
  ; Pin the 48 KB framebuffer to internal SRAM (SDK flag): under SPIRAM_USE_MALLOC
  ; it otherwise lands in octal PSRAM, 4-9x slower on the hottest read-modify-write
  ; paths. Internal-first, plain-malloc fallback (logged if it fires). The async
  ; shadow is also covered, but single-buffer mode never allocates one, so the
  ; net internal cost on this firmware is 48 KB, not 96.
  -DFREEINK_FB_INTERNAL
  ; 40 MHz SDMMC instead of the mislabelled 20 MHz default (SDK flag), ~2x
  ; sequential throughput. Reads hardware-validated 2026-08; the write-integrity
  ; soak (~50 MB File-Transfer round-trip + byte-compare) is still outstanding.
  -DFREEINK_X4PRO_SDMMC_HS
  ; Keep decompressed builtin glyph groups resident in PSRAM for the session, so
  ; group DEFLATE costs once per session instead of ~30-100 ms per page turn.
  -DCROSSPOINT_RESIDENT_FONT_GROUPS
  ; Raise SdCardFont's advance-metadata cap from 768 (a ~380 KB C3 bound) so CJK
  ; layout stops falling back to per-glyph SD reads once the table fills.
  -DCROSSPOINT_SDFONT_ADVANCE_LIMIT=8192
  ; RSS feed sync: Home gains "Sync RSS Feed" and Settings > System gains
  ; "Configure RSS Feed". The device fetches a personal LAN RSS 2.0 feed over
  ; plain http, shows one checkbox row per <item>, and mirrors the ticked set
  ; into the destination folder — downloading the ready-made .epub each
  ; <enclosure> points at, and deleting (with its reading cache) the file of
  ; any row the user unticks. Files the feed does not mention are never
  ; touched.
  ;
  ; HELD OFF BY THE IROM GATE, not by the feature. The whole implementation is
  ; in the tree behind CROSSPOINT_RSS_SYNC and builds clean; enabling it here
  ; is a one-line uncomment. Measured on this commit (esptool image_info,
  ; segment at load addr 0x42000020; the cliff is 0x1C0000):
  ;
  ;   env      LOG_LEVEL  without RSS         with RSS
  ;   combo        1      0x1bc650 (14.4 KB)  0x1bf71c ( 2.22 KB)
  ;   pmstats      1      0x1bcaf8 (13.3 KB)  0x1bfc24 ( 0.96 KB)  <-- gate fail
  ;   combo        0      -                   0x1bf1fc ( 3.50 KB)
  ;   pmstats      0      -                   0x1bf710 ( 2.23 KB)
  ;
  ; The feature costs ~12.2 KB of IROM (~7.5 KB activity, ~2.3 KB settings
  ; screen, ~1.9 KB parser, rest plumbing) and pmstats lands 988 B under the
  ; cliff — inside the 2 KB reserve. pmstats composes from
  ; ${env:x4pro-combo.build_flags}, so it cannot opt out of a flag combo
  ; carries: it is both envs or neither. Dropping both combo envs to
  ; LOG_LEVEL=0 buys ~1.3 KB and would put pmstats at 2.23 KB — still only at
  ; the edge of the reserve, and a logging-policy call (the LOG_LEVEL=1 choice
  ; is recorded above) rather than one to make as a side effect of a feature.
  -DCROSSPOINT_RSS_SYNC
  ; Flashcards (spaced repetition, FSRS-6). Home gains "Sync Decks" and
  ; Settings > System gains "Configure Deck Feed": the device fetches a second
  ; personal LAN RSS 2.0 feed over plain http whose <enclosure>s are ready-made
  ; CPDK v1 deck files (the PC converter does all Anki-format work), mirrors the
  ; ticked set into /Decks exactly as the RSS flow mirrors epubs, and deletes an
  ; unticked deck together with its scheduling state file. A completed download
  ; is CPDK-header-checked before it is renamed into place, and a deck that is
  ; already present is re-downloaded when the feed's guid advertises a content
  ; hash the local header does not match -- decks are mutable, and the .state
  ; file survives the replacement. Round 3 adds the study session itself:
  ; FlashcardStudyActivity (deck picker, mode select, review loop with the four
  ; FSRS grade buttons, one-deep undo, suspend, done screen), the CPST state
  ; file + queue builder in src/flashcards, and lib/FsrsSched, which nothing
  ; linked before this round.
  ;
  ; Combo-only, like every flag in this section, and default-off everywhere
  ; else: whole-file #ifdef guards, so with the flag off every new translation
  ; unit compiles to nothing. Re-verified on [env:default] and [env:x4pro] for
  ; round 3: zero Flashcard*/fsrs::/flashcards:: symbols are linked in either
  ; ([env:default] IROM 0x1f2288). The i18n string tables still grow
  ; unconditionally for every build -- 28 new keys this round on top of R2's
  ; eight, at the ~92 B/key rate R2 measured -- but that is DROM and does not
  ; count against the IROM cliff.
  ;
  ; *** THIS FLAG NO LONGER FITS UNDER THE 0x1C0000 CLIFF. *** Measured from
  ; the freshly linked firmware.elf (esptool elf2image + image_info, segment at
  ; load addr 0x42000020) -- never from .pio/build/*/firmware.bin, which the
  ; build cache restores stale:
  ;
  ;   env      R2 only (baseline)   R2 + R3            headroom = 0x1C0000 - addr
  ;   combo    0x1ba8f4             0x1c06a4           -1,700 B  OVER
  ;   pmstats  0x1bae30             0x1c0bf0           -3,056 B  OVER
  ;
  ; Round 2 (fetch half) cost 12,500 B on combo / 12,488 B on pmstats. Round 3
  ; costs 23,984 B / 24,000 B, so the whole feature is ~36.4 KB against the
  ; ~21.8 KiB (combo) / ~20.5 KiB (pmstats) that were left after R2. Round 3's
  ; own split, from a symbol-level diff of the two combo ELFs:
  ;
  ;   FlashcardStudyActivity            8,825 B   (the UI: 5 screens, wrap+page,
  ;                                                undo/suspend, grade preview)
  ;   src/flashcards (R3a logic layer)  6,784 B   (DeckFile, StateStore incl. the
  ;                                                re-download merge, SessionQueue)
  ;   lib/FsrsSched                     2,830 B
  ;   newly linked libm float           2,638 B   (__ieee754_powf 1,493, expf 444,
  ;                                                scalbnf/rintf/powf/expf wrappers)
  ;   plumbing + literal pools          ~2,900 B
  ;
  ; Two thirds of the round (12,252 B) is the scheduler, its state layer and the
  ; float math they need -- fixed cost that no amount of UI trimming reaches.
  ; The UI half is already trimmed of the obvious fat (insertion sort instead of
  ; the std::sort instantiation for vector<string>, one shared drawButtonMenu
  ; call site instead of three, one shared two-line message screen); that pass
  ; bought 972 B and there is no comparable second one.
  ;
  ; The levers, for whoever picks one -- this is a product call, not a
  ; formatting one, so R3 deliberately leaves the flag as the owner set it in
  ; R2 rather than choosing:
  ;   1. Comment out -DCROSSPOINT_FLASHCARDS below. The whole feature stays in
  ;      the tree and builds clean; re-enabling is a one-line uncomment. This is
  ;      exactly what CROSSPOINT_RSS_SYNC did while it was over the gate.
  ;   2. Drop CROSSPOINT_RSS_SYNC instead (~12.2 KB, measured when it landed) --
  ;      one feed feature or the other, not both.
  ;   3. Find ~4-6 KB elsewhere. LOG_LEVEL is already 0 and mDNS already gone
  ;      (see those comments); the recorded list is CONTEXT.md §8.
  ;
  ; RESOLVED 2026-09-08 by lever 3: the RMT/RGB-LED lever below (-13,888 B combo
  ; / -13,936 B pmstats) puts the flag back under the cliff with room to spare.
  ; Post-lever, with -DCROSSPOINT_FLASHCARDS still enabled:
  ;
  ;   env      IROM      headroom = 0x1C0000 - addr
  ;   combo    0x1bd064  12,188 B (11.90 KiB)
  ;   pmstats  0x1bd580  10,880 B (10.63 KiB)
  ;
  ; Both are clear of the 2 KB floor rule and of the 4 KB working bar. None of
  ; options 1 or 2 was taken; the flag stays as the owner set it in R2.
  -DCROSSPOINT_FLASHCARDS
  ; Allocation gates measure malloc-visible internal RAM ({DEFAULT|INTERNAL})
  ; instead of bare INTERNAL; on this env's current malloc policy (no reserve
  ; pool) the practical delta is small — it is correctness plumbing that makes
  ; the deferred SPIRAM-policy step safe.
  -DCROSSPOINT_PSRAM_HEAP_GAUGE
  ; mDNS compiled out (~28 KB IROM back): the 2026-08-25 develop rebase pushed
  ; both combo images past the 0x1C0000 mapping cliff and LOG_LEVEL=0 alone
  ; bought only ~1.3 KB. Cost: `crosspoint.local` stops resolving in STA mode
  ; on THESE envs only (the web-server screen leads with the IP URL + QR; AP
  ; mode's captive portal resolves any hostname without mDNS). Dev env x4pro
  ; keeps mDNS. NOTE the define alone is not enough: the LDF links the ESPmDNS
  ; wrapper (and its global ctor survives gc) on the textual #include, so the
  ; combo envs also carry `lib_ignore = ESPmDNS` — remove BOTH to restore the
  ; name, or pick another lever (CONTEXT.md §8 list).
  -DCROSSPOINT_NO_MDNS
  ; IROM lever (2026-09-08): the Arduino core's RGB-LED helper and the whole RMT
  ; driver stack behind it are dropped from the link. The flag activates the
  ; stub definitions in src/platform/no_rgb_led.c, which preempt extraction of
  ; libFrameworkArduino.a(esp32-hal-rgb-led.c.o) -- the only thing that
  ; references esp32-hal-rmt.c.o, which is the only thing that references
  ; libesp_driver_rmt.a. That TU's comment carries the full chain and the
  ; measured figures are in the lever table below. THESE ENVS ONLY: no source
  ; behaviour changes (the one caller is an unreachable RGB_BUILTIN branch in
  ; __digitalWrite), and there is no RGB LED on this board. NOT an sdkconfig
  ; change -- the kernel is untouched; libesp_driver_rmt.a simply stops being
  ; pulled out of the prebuilt library set. Remove this line to restore it.
  -DCROSSPOINT_NO_RGB_LED
  ; Image pages paint in ONE panel activation using the SSD1677's OEM "factory"
  ; absolute 4-gray waveform, instead of a B/W base plus the ~1.2 s refinement
  ; pass whose internal phases read as several visible passes. Needs the
  ; absolute plane encoding (unmarked = white), so the plane passes carry the
  ; whole frame. Gated at runtime on the driver capability, so a UC8279-X4
  ; device batch on this same image keeps the two-activation path.
  ; EXPERIMENT: SSD1677-only app feature, dropped with that driver.
  ;-DCROSSPOINT_IMG_FACTORY_GRAY
  ; Image pages stop forcing a clean (flashing) base refresh on the NEXT page.
  ; Measured on a UC8179 X4 Pro: the forced HALF base costs 1491 ms of a ~1.8 s
  ; image page turn (the grayscale pass itself is only 296 ms), because HALF and
  ; FULL both run the panel's OTP GC waveform at TSSET 0x1E while FAST runs the
  ; 559 ms partial. The UC8179 driver already substitutes stock's non-flashing
  ; XTF_PRE_BW_MID previous->current transition for any FAST paint that follows
  ; grayscale, which re-drives the gray charge per pixel — so the clean is
  ; redundant there. Gated at runtime on the driver capability
  ; (fastAfterGrayscaleSafe), so SSD1677 and every other panel keep today's path;
  ; the periodic ghost-clear still fires on the normal SETTINGS refresh cadence.
  -DCROSSPOINT_IMG_NO_FORCED_CLEAN
  ; UC8179 rail power-off. The panel's analog rails (booster, VGH/VGL, VSH/VSL,
  ; VCOM) otherwise latch ON at the first refresh and stay on for the entire
  ; reading session: displayGray() discards turnOff for stock parity and nothing
  ; on this device passes turnOff=true. The SDK's controllerIdle()/
  ; beginDisplayWork() hooks are the designed vehicle and had zero callers.
  ; main.cpp parks the rails on the same 3 s inactivity threshold as the CPU
  ; power saving, and ActivityManager prewarms them on the render-queue edge —
  ; every requestUpdate(), so timer/background/USB renders get the ramp too — so
  ; the measured 127 ms PON ramp overlaps CPU-side page composition. SSD1677-class
  ; prior for the saving: ~1-3 mA latched vs ~25-40 uA off. NEEDS A METER on
  ; this silicon — no UC8179 rail current figure exists anywhere.
  -DFREEINK_UC8179_RAIL_POWEROFF
  ; UC8179 lean plane streams, ~55-70 ms off every anti-aliased page turn: the
  ; OLD-plane restore at the end of the base transition becomes lazy (the AA
  ; upload overwrote it on every reading page), the NEW-plane restore after the
  ; gray activation is dropped (every path that can follow it re-streams DTM2
  ; before use), and the 120 non-visible gate padding rows go out as one SPI
  ; burst instead of 120 separate transactions. Byte-identical wire content.
  -DFREEINK_UC8179_LEAN_STREAMS
  ; Kill the text-over-image ghost. The UC8179 gray-exit transition
  ; (XTF_PRE_BW_MID) drives a was-white->black pixel for 25 saturating frames but
  ; gives a was-black->black pixel only the 4-frame KK corrective, so black ends
  ; up at two depths — and the AA waveform's gray drive is ~2 frames off black.
  ; The result is the OUTGOING page's text pattern surviving as density variation
  ; inside the INCOMING page's grays, which is invisible on a text page and very
  ; visible on a photo. Running the same precondition a second time with
  ; DTM1 == DTM2 fires only the uniform KK/WW correctives and equalizes black
  ; depth before the gray planes land. Hardware-validated by the user as a fix.
  ; It costs a second full activation (~666 ms), so it is NOT unconditional: the
  ; driver exposes a one-shot requestDeepGrayEqualize() hint and the reader arms
  ; it only on the image-page branch, leaving text page turns untouched.
  -DFREEINK_UC8179_DOUBLE_GRAY_PRE
  ; Overlap the whole-buffer AA plane renders with the B/W base waveform, up to
  ; ~666 ms off every anti-aliased page turn. The reader's non-tiled grayscale
  ; path is strictly serial today: the base transition runs to completion with
  ; the CPU idle (666 ms measured for stock's 25-frame XTF_PRE_BW_MID, 1492 ms
  ; on the periodic clean), then the CPU renders both AA planes with the panel
  ; idle, then the 296 ms gray activation fires. The SDK flag splits the base
  ; transition into a start (through the DRF opcode) and a finish (completion
  ; wait plus the post-activation pipeline), reached through the existing
  ; displayBufferAsync / waitRefreshComplete machinery; the app flag makes the
  ; reader render BOTH planes inside that window, parking the first in one
  ; panel-sized PSRAM buffer because the framebuffer is its only plane scratch.
  ; Safe because the panel scans controller RAM, not the host framebuffer, and
  ; the driver keeps a PSRAM snapshot of the base frame for the post-waveform
  ; OLD-plane restore. Falls back to the serial path when the PSRAM buffer
  ; cannot be had, and in night mode (the async entry point declines while
  ; inverted). Gated at RUNTIME on the new driver capability
  ; asyncRefreshKeepsOwnFrame(), so an SSD1677 or UC8279-X4 device batch on this
  ; same image keeps today's path — both of those defer a refresh but re-read
  ; the framebuffer afterwards to rebuild their differential baseline.
  ; The SSD1677 analogue of this overlap measured 1274 -> 822 ms.
  ; Class-scoped block styling with left-border rules. The CSS engine already
  ; matched `element.class` selectors and already honoured padding-left, the
  ; 4-value margin shorthand and font-style, so what this adds is the one
  ; property that was silently dropped: border-left. A block that declares one
  ; records a vertical rule, and every rendered line of that block and of its
  ; descendants draws one rule per bordered ancestor down the left edge — so a
  ; nested-<blockquote> comment tree (the shape the RSS server emits for Hacker
  ; News threads) renders as stacked thread lines instead of flat text, at a
  ; per-level inset of margin-left + border + padding-left rather than a
  ; browser's 40px, keeping nearly full text width at depth.
  ; Carries the cache-format changes too (CSS_CACHE_VERSION 11->12,
  ; SECTION_FILE_VERSION 44->45; renumbered for the 2026-09-02 develop rebase,
  ; which brought upstream to 11 and 44), which is what keeps a build without
  ; the flag byte-identical: the cost is that the combo envs rebuild their
  ; section and CSS caches once on first flash.
  ;
  ; HELD OFF BY THE IROM GATE, not by the feature — same situation RSS sync was
  ; in above. The whole implementation is in the tree behind
  ; CROSSPOINT_CSS_CLASS_RULES and builds clean on all four envs; enabling it
  ; here is a one-line uncomment. Measured on this commit (esptool image_info,
  ; segment at load addr 0x42000020; the cliff is 0x1C0000). Both rows are full
  ; builds that rebuilt the IDF core from this env's custom_sdkconfig — a run
  ; that skips that step links the previous env's core libs and reports ~252 B
  ; low, so a short (~50 s, no "Copied compiled esp32s3 IDF libraries") build is
  ; not a valid measurement:
  ;
  ;   env      without CSS rules   with CSS rules
  ;   pmstats  0x1beac8 (5.30 KB)  0x1bf0b8 (3.82 KB)  <-- gate fail
  ;   combo    0x1beadc (5.29 KB)  -
  ;
  ; The feature costs ~1.5 KB of IROM (~570 B CSS parser, ~400 B the per-line
  ; border table's serialization, ~370 B the chapter parser's inlined combine,
  ; rest render + plumbing) and pmstats lands 3912 B under the cliff — 184 B
  ; inside the 4 KB reserve. pmstats composes from ${env:x4pro-combo.build_flags},
  ; so it cannot opt out of a flag combo carries: it is both envs or neither.
  ; Dropping both combo envs to LOG_LEVEL=0 is the recorded ~1.3 KB lever, but
  ; that is a logging-policy call rather than one to make as a side effect of a
