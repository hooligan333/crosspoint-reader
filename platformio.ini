  ;   combo    -                   0x1bec4c (4.93 KB)
  ;
  ; pmstats lands 3760 B under the cliff, comfortably clear of the 2 KB floor
  ; rule recorded above. The date maths is deliberately integer-only: mktime() +
  ; localtime_r() cost ~1.6 KB more for a column the log wants as raw RTC time.
  ;
  ; NOTE ON THE IROM TABLES IN THIS FILE: each one is a measurement taken on the
  ; day its feature landed, against whatever the tree contained then. The "without"
  ; column of a later table is therefore NOT the "with" column of an earlier one,
