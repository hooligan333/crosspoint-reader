  ;
  ; PROFILING EVENTS (later extension, same flag). The row gains a `detail`
  ; column (Entry 12 -> 16 B, ring still 32 = 512 B static) and new event kinds
  ; aimed at power and load-time statistics: FR (non-FAST refresh
  ; requests), BOOK_OPEN/BOOK_RDY (book load time, cold vs stale vs warm),
  ; CH_START/CH_RDY (chapter load time, prebuilt vs on demand), CHG_ON/CHG_OFF
  ; (charge sessions, so battery stats can exclude them) and LS/LSN (light-sleep
