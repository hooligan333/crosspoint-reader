[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
version = 1.5.0

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
; missingInclude (project headers) is suppressed alongside missingIncludeSystem: on a
; fresh CI checkout cppcheck has no resolved include paths, so it reports every
; project header as missing (~400 information-level lines) and fails the job.
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=missingInclude --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
# MEMFIX-PORT: single-precision ECC (sp_c32.c). Without it every P-256 operation
# (TLS 1.3 key_share keygen, ECDHE, ECDSA cert verify) runs on fast-math bignums
# that WOLFSSL_SMALL_STACK heap-allocates at FP_MAX_BITS size -- tens of KB of
# temporaries, which OOMs (MP_MEM) at the ~50KB free heap a reading session
# leaves. SP uses fixed 256-bit arrays: a few KB, and several times faster.
# SP_SMALL trades the large precomputed point tables for smaller flash.
  -DWOLFSSL_HAVE_SP_ECC
  -DWOLFSSL_SP_SMALL
# Arduino-wolfSSL's user_settings.h enables TLS extensions, supported curves,
# HKDF, and RSA-PSS when WOLFSSL_TLS13 is set. Do not repeat those defines here:
# GCC reports every library translation unit as a macro redefinition.
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DHAVE_SNI
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/patch_pioarduino_cache.py
  pre:scripts/patch_wolfssl.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  post:scripts/register_unit_tests_target.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  UsbMassStorage=symlink://freeink-sdk/libs/hardware/UsbMassStorage
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  Imu=symlink://freeink-sdk/libs/hardware/Imu
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  wolfssl/Arduino-wolfSSL @ 5.7.2

lib_ignore =
  BLE

; The standard firmware profiles reclaim heap by rebuilding the Arduino core.
; USB-OTG (FREEINK_CAP_USB_MSC) profiles like the X4 Pro and Paper Mono
; intentionally do not inherit this section: they need PioArduino's complete
; prebuilt TinyUSB component graph, which the custom core rebuild omits.
[firmware_tuned]
; MEMFIX-PORT: custom_sdkconfig heap reclamation (~32-37 KB). Rebuilds the
; Arduino core libs on first build (slower once, cached after; needs the CMake
; pin in platformio.local.ini on macOS).
;
; If an interrupted rebuild fails with "multiple definition of 'app_main'"
; (stale generated scaffold), clean it up with:
;   rm -rf .dummy CMakeLists.txt sdkconfig.default sdkconfig.defaults .pio/build/default
; Do NOT use `git clean -fdX` — it deletes platformio.local.ini.
custom_sdkconfig =
  ; Task stack right-sizing from measured high-water marks (heap block map +
  ; per-task stack audit, July 2026): esp_timer used ~0.8 KB of 8 KB across
  ; every capture; the FreeRTOS timer service used ~0.5 KB
  ; of 4 KB. Neither runs TLS or app code. ~7 KB back to the heap.
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  ; Move the WiFi stack's non-critical hot paths out of IRAM into flash.
  ; On the C3, IRAM and DRAM share one SRAM pool, so the ~25-30 KB this
  ; frees lands directly in the heap — paid for with lower WiFi throughput
  ; during transfers (occasional sync/OTA use, not streaming: acceptable).
  ; IRAM cost is static, so the heap gain applies even with WiFi off.
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  ; Keep the Arduino wrappers for the removed cloud components (below) out of
  ; the core source list; all other bundled libraries default to enabled.
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  ; ESP_SR (speech recognition) only exists in the S3 core; its wrapper includes
  ; ESP_I2S.h, which the isolated core rebuild can't resolve. Unused here anyway,
  ; so drop it or the sticky env fails to build.
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n

; Drop unused cloud components from the core rebuild. esp_insights/rainmaker
; require embedded server certs the lib builder can't generate
; ("https_server.crt.S not found"); this firmware uses none of them.
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/esp_schedule
  espressif/esp_rcp_update
  espressif/esp_secure_cert_mgr
  espressif/cbor

[env:default]
extends = base, firmware_tuned
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2 ; Set log level to debug for development builds


[env:gh_release]
extends = base, firmware_tuned
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base, firmware_tuned
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base, firmware_tuned
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

; --- Seeed Sticky — ESP32-S3R8, 3.97" 800x480 SSD1677 + GT911 touch -----------
; Different MCU family than the C3 envs (one binary per family). The SDK
; auto-enables CAP_TOUCH (GT911) and the BQ27220 gauge for this device; PSRAM is
; intentionally left off (48KB framebuffer fits in DRAM, same as X4).
;   pio run -e sticky -t upload
[env:sticky]
extends = base, firmware_tuned
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2

[env:sticky-gh_release]
extends = base, firmware_tuned
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:sticky-gh_release_rc]
extends = base, firmware_tuned
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

; --- Xteink X4 Pro — ESP32-S3, 16MB flash / 8MB PSRAM, SSD1677 + GT911 --------
; The SDK profile supplies the X4 Pro pinout, display, touch controller, and
; capacitive Home key. USB Serial/JTAG is the normal USB personality so
; PlatformIO can monitor and flash the reader. USB Drive starts MSC only for
; that File Transfer activity, then reboots back to this default on exit.
;   pio run -e x4pro -t upload
; Shared flag lists: x4pro_flags.common is everything the x4pro env defines
; except the log level; combo_flags.features is the combo feature set. The
; pmstats env composes both with info-level logging, because a value override
; on an inherited define cannot work here: the component build harvests -D
; defines only, drops -U, and vendored TUs build with -Werror, so a duplicate
; definition is fatal.
[x4pro_flags]
common =
  -DFREEINK_DEVICE_X4PRO=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_X4_Pro\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  ; Whole in-book images live in a PSRAM LRU across page turns instead of the
  ; internal-RAM slot that only survives one page render. Needs PSRAM.
  -DCROSSPOINT_PSRAM_IMAGE_CACHE
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-x4pro\"
  -DENABLE_SERIAL_LOG
  ; X4 Pro SD is native SDMMC (1-bit), mounted through SdFat's block-device API.
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  ; Page-turn and chapter-build SD elimination, all three PSRAM-funded:
  ; 16KB expat chunks instead of 1KB (16x fewer SD reads per chapter build),
  ; the idle prewarm's deserialized page kept for the forward turn that wants
  ; it, and a lazy whole-file PSRAM mirror of book.bin so spine/TOC lookups
  ; stop seeking the card.
  -DCROSSPOINT_PARSE_BUFFER_SIZE=16384
  -DCROSSPOINT_PAGE_CACHE
  -DCROSSPOINT_BOOKBIN_PSRAM
  ; Chapter pagination moves off the reader's loop and onto the idle second
  ; core, in exact page-count ticks under the same RenderLock, with a
  ; notification-driven idle wait so the task does not hold off light sleep;
  ; near a chapter end it also pre-loads the next spine's CACHED section so the
  ; forward boundary turn swaps it in instead of loading synchronously.
  -DCROSSPOINT_BG_BUILD_TASK
  -DCROSSPOINT_NEXT_SECTION_PREBUILD
  ; When that task has nothing left to build, it pre-decodes the images on the
  ; next few pages into their .pxc cache files, so the first view of an image
  ; page renders from cache (~100 ms) instead of stalling for a multi-second
  ; extract-and-decode. Requires CROSSPOINT_BG_BUILD_TASK: it IS that task's
  ; idle work.
  -DCROSSPOINT_BG_IMAGE_DECODE
  ; Adds "Toggle Light" to the Short Power Button Click options: one press
  ; blacks out the frontlight + night mode and the next restores exactly the set
  ; that was on. Inert unless the user picks it; the flag only surfaces the
  ; choice.
  -DCROSSPOINT_PWR_TOGGLE_LIGHT

[combo_flags]
features =
  -DCROSSPOINT_AUTO_LIGHT_SLEEP
  -DFREEINK_FRONTLIGHT_LS
  -DCROSSPOINT_TOUCH_INT_WAKE
  -DFREEINK_GT911_INT_WAKE
  ; Fast 0x1C DU refresh for page turns (SDK #38, merged; flag default-off).
  -DFREEINK_X4PRO_FAST_DU_SHORTCUT
  ; Panel self-power-off after every refresh (~25-40 uA dwell instead of
  ; ~1-3 mA). Hardware-validated 2026-08-19: no ghosting over long runs, AA
  ; quality good, no post-AA BW degradation. SDK-side flag (fork branch).
  -DFREEINK_X4PRO_RAIL_POWEROFF_SHORTCUT
  ; Stretch the bg build task's parked fallback to match ~1 s sleep windows.
  ; Hardware-validated 2026-08-19: 1.85 sleeps/s vs 4.5 baseline, 0 rejects.
  -DCROSSPOINT_BG_IDLE_STRETCH_MS=1000
  ; Pin the 48 KB framebuffer to internal SRAM (SDK flag): under SPIRAM_USE_MALLOC
  ; it otherwise lands in octal PSRAM, 4-9x slower on the hottest read-modify-write
  ; paths. Internal-first, plain-malloc fallback (logged if it fires). The async
  ; shadow is also covered, but single-buffer mode never allocates one, so the
  ; net internal cost on this firmware is 48 KB, not 96.
  -DFREEINK_FB_INTERNAL
  ; 40 MHz SDMMC instead of the mislabelled 20 MHz default (SDK flag), ~2x
  ; sequential throughput. Reads hardware-validated 2026-08; the write-integrity
  ; soak (~50 MB File-Transfer round-trip + byte-compare) is still outstanding.
  -DFREEINK_X4PRO_SDMMC_HS
  ; Keep decompressed builtin glyph groups resident in PSRAM for the session, so
  ; group DEFLATE costs once per session instead of ~30-100 ms per page turn.
  -DCROSSPOINT_RESIDENT_FONT_GROUPS
  ; Raise SdCardFont's advance-metadata cap from 768 (a ~380 KB C3 bound) so CJK
  ; layout stops falling back to per-glyph SD reads once the table fills.
  -DCROSSPOINT_SDFONT_ADVANCE_LIMIT=8192
  ; Allocation gates measure malloc-visible internal RAM ({DEFAULT|INTERNAL})
  ; instead of bare INTERNAL; on this env's current malloc policy (no reserve
  ; pool) the practical delta is small — it is correctness plumbing that makes
  ; the deferred SPIRAM-policy step safe.
  -DCROSSPOINT_PSRAM_HEAP_GAUGE

[env:x4pro]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
; Use the prebuilt dio_opi Arduino variant: its TinyUSB component is enabled
; for CDC and MSC. This profile deliberately extends base rather than
; firmware_tuned, whose custom SDK rebuild omits that component.
build_flags =
  ${base.build_flags}
  ${x4pro_flags.common}
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2

; --- Xteink X4 Classic (X4C) ---------------------------------------------------
; Same ESP32-S3 board and display stack as the X4 Pro (SSD1677/UC8179/UC8279 auto-
; detected at boot) but buttons-only: no touchscreen and no frontlight, so the
; freed pins become four extra front buttons (two side page-turn keys + four bottom
; keys). Native 1-bit SDMMC + USB-MSC file transfer as on the X4 Pro; drops the
; frontlight flag. See freeink-sdk/docs/xteink-x4c-support.md.
;   pio run -e x4c -t upload
[env:x4c]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4CLASSIC=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_X4_Classic\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-x4c\"
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2
  ; X4C SD is native SDMMC (1-bit), mounted through SdFat's block-device API.
  -DUSE_BLOCK_DEVICE_INTERFACE=1

[env:x4c-gh_release]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4CLASSIC=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_X4_Classic\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds
  -DUSE_BLOCK_DEVICE_INTERFACE=1

[env:x4pro-gh_release]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_X4_Pro\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds
  -DUSE_BLOCK_DEVICE_INTERFACE=1

[env:x4pro-gh_release_rc]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_X4_Pro\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds
  -DUSE_BLOCK_DEVICE_INTERFACE=1

; --- X4 Pro + automatic light sleep and interrupt-woken idle -----------------
; [env:x4pro] plus the two power features that need extra kernel configuration,
; which is why they live in their own env rather than on x4pro itself:
;   * CROSSPOINT_AUTO_LIGHT_SLEEP — esp_pm DFS 80-240 MHz with FreeRTOS tickless
;     idle light-sleeping the chip between wakes (the reading-idle battery
;     lever: both cores otherwise sit awake through every loop delay);
;   * CROSSPOINT_TOUCH_INT_WAKE + FREEINK_GT911_INT_WAKE — the idle loop blocks
;     on the GT911 INT and the button GPIOs instead of re-polling 20x/s, so one
;     sleep window replaces twenty. The SDK flag is what makes the GT911 INT
;     hold a LEVEL; a light-sleeping SoC clock-gates its edge detector and would
;     never see the controller's default edge pulse.
; FREEINK_FRONTLIGHT_LS is already inherited from [env:x4pro] and is restated
; below on purpose: it is what keeps a lit frontlight from blinking dark on
; every sleep window (RC_FAST-clocked LEDC survives light sleep), so this env
; must not silently lose it if [env:x4pro] ever drops it. A repeated -D of the
; same token is a no-op to the compiler.
;
; custom_sdkconfig REPLACES the [base] list rather than extending it, so the
; whole base block is repeated verbatim below and only the last three lines are
; new. Dropping one of the repeated lines would silently build a different
; kernel from every other env.
;   pio run -e x4pro-combo -t upload
[env:x4pro-combo]
extends = env:x4pro
; Info-level logging (not debug), same as the pmstats variant: LOG_DBG cost the
; combo image its IROM headroom (~1.2 KB from the 0x1C0000 mapping cliff, see
; the pmstats env comment). Anything debug-level is checked against a pmstats
; build instead (Erica's direction, 2026-08-20). Composed from the shared
; sections rather than inheriting env:x4pro, whose debug log level cannot be
; value-overridden (component builds harvest -D only).
build_flags =
  ${base.build_flags}
  ${x4pro_flags.common}
  -DLOG_LEVEL=1
  ${combo_flags.features}
custom_sdkconfig =
  ; --- verbatim copy of [base] custom_sdkconfig (see its comments there) ---
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
  ; --- new for this env ---
  ; esp_pm_configure() fails without both of these, and HalPowerManager then
  ; degrades to a logged no-op with no DFS at all — they ship with the flag.
  CONFIG_PM_ENABLE=y
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
  ; The USB-Serial-JTAG driver holds a no-light-sleep lock while a host is
  ; enumerated, so an attached console keeps working (a sleep window drops the
  ; CDC link). This is the load-bearing USB guard on the X4 Pro, whose board
  ; profile leaves usbDetect unassigned — power measurements must be taken
  ; DETACHED, because sleep is suppressed by design while plugged in.
  CONFIG_USJ_NO_AUTO_LS_ON_CONNECTION=y

; x4pro-combo plus CONFIG_PM_PROFILING and the CROSSPOINT_PM_STATS serial dump:
; CMD:PMSTATS (or a 60 s auto-print while a host is attached) reports esp_pm's
; cumulative mode/lock residency. Measurement builds only — profiling adds a
; small bookkeeping cost to every lock operation.
[env:x4pro-combo-pmstats]
extends = env:x4pro-combo
; Inherits the combo flag set (already info-level logging) and adds the
; CMD:PMSTATS instrumentation. VERIFY after any change to either combo env:
; esptool image_info -- the IROM segment (load addr 0x42000020; its number
; shifts between builds) must stay < 0x1C0000, the vendor bootloader mapping
; cliff past which images do not boot (bisected + boot-confirmed 2026-08-20).
build_flags =
  ${env:x4pro-combo.build_flags}
  -DCROSSPOINT_PM_STATS
custom_sdkconfig =
  ; --- verbatim copy of [env:x4pro-combo] custom_sdkconfig (it REPLACES, not
  ; --- extends; see the comments there) ---
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
  CONFIG_PM_ENABLE=y
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
  CONFIG_USJ_NO_AUTO_LS_ON_CONNECTION=y
  ; --- new for this env ---
  ; Compiles the esp_pm light-sleep enter/exit callback machinery the LSSTATS
  ; residency counters register against. KERNEL-CONFIG EXPERIMENT: kernel
  ; option changes have boot-failed before (see CONFIG_PM_PROFILING below) --
  ; always flash-test after touching this block.
  CONFIG_PM_LIGHT_SLEEP_CALLBACKS=y
  ; CONFIG_PM_PROFILING=y is DISABLED pending diagnosis: kernels built with it
  ; consistently fail to boot through the vendor boot chain ("Invalid app image
  ; header" from cpu_start's header-relocation check), while byte-equivalent
  ; kernels without it boot. Bisected 2026-08-20; mechanism unexplained. The
  ; CMD:PMSTATS dump degrades to the lock table (no mode/residency rows);
  ; app-level residency counters are the replacement path if needed.

; --- M5Stack Paper Mono — ESP32-S3, SSD1683 800x480 + FT6336 touch + frontlight
; Power/reset plumbing runs through the M5PM1 PMIC and M5IOE1 expander; the SDK
; sequences them itself. Touch, frontlight, RTC, and other capabilities are
; selected by the Paper Mono BoardConfig profile.
; Extends base (not firmware_tuned): USB Drive needs the prebuilt dio_opi
; Arduino variant, whose TinyUSB component is enabled for CDC and MSC.
;   pio run -e papermono -t upload
[env:papermono]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_PAPERMONO=1
  -DFREEINK_CAP_USB_MSC=1
  ; The SSD1683 grayscale target planes are batched in PSRAM.
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_Paper_Mono\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-papermono\"
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2
  ; Native 1-bit SDMMC is mounted through SdFat's block-device interface.
  -DUSE_BLOCK_DEVICE_INTERFACE=1

[env:papermono-gh_release]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_PAPERMONO=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_Paper_Mono\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds
  -DUSE_BLOCK_DEVICE_INTERFACE=1

