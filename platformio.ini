  -DCROSSPOINT_USAGE_LOG
  ; Automatic daylight saving for the status-bar clock. Settings > Customise
  ; Status Bar gains an "Auto DST" row (Off / US / EU / AU) next to the UTC
  ; offset; while a rule is selected the stored offset is read as STANDARD time
  ; and the displayed clock gains an hour inside that region's DST window.
  ; Baked rules, all +1 h:
  ;   US  2nd Sun Mar 02:00 local standard -> 1st Sun Nov 02:00 local DST
  ;   EU  last Sun Mar 01:00 UTC           -> last Sun Oct 01:00 UTC
  ;   AU  1st Sun Oct 02:00 local standard -> 1st Sun Apr 03:00 local DST
  ;       (southeast AU; southern hemisphere, so the window wraps the new year)
  ; Everything is compared as minutes-into-the-year in one reference frame
  ; (UTC for EU, local standard time for US/AU), so the autumn instant is
  ; written an hour earlier than the statute and the fall-back hour resolves
  ; correctly. Integer-only, sharing UsageLog's Hinnant civil-date maths via
  ; src/CivilDate.h; the RTC is read at most once a minute and the answer
  ; cached, so the per-render status-bar snapshot costs no I2C. The usage log
  ; is untouched — it keeps recording raw UTC. See src/ClockDst.h.
