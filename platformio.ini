; --- X4 Pro + automatic light sleep and interrupt-woken idle -----------------
; [env:x4pro] plus the two power features that need extra kernel configuration,
; which is why they live in their own env rather than on x4pro itself:
;   * CROSSPOINT_AUTO_LIGHT_SLEEP — esp_pm DFS 80-240 MHz with FreeRTOS tickless
;     idle light-sleeping the chip between wakes (the reading-idle battery
;     lever: both cores otherwise sit awake through every loop delay);
;   * CROSSPOINT_TOUCH_INT_WAKE + FREEINK_GT911_INT_WAKE — the idle loop blocks
;     on the GT911 INT and the button GPIOs instead of re-polling 20x/s, so one
;     sleep window replaces twenty. The SDK flag is what makes the GT911 INT
;     hold a LEVEL; a light-sleeping SoC clock-gates its edge detector and would
;     never see the controller's default edge pulse.
; FREEINK_FRONTLIGHT_LS is NO LONGER inherited: upstream #3289 (3b73e7fc)
; removed it from every X4 Pro env, so the line in [combo_flags] below is now
; its SOLE definition anywhere in this file. Do not delete it as redundant --
; it is what keeps a lit frontlight from blinking dark on every sleep window
; (RC_FAST-clocked LEDC survives light sleep). Without it lib/hal/HalFrontlight
; falls back to holding the no-light-sleep PM lock whenever the light is on,
; which disables the whole idle-sleep win for anyone reading with the light.
;
; custom_sdkconfig REPLACES the [base] list rather than extending it, so the
; whole base block is repeated verbatim below and only the last three lines are
; new. Dropping one of the repeated lines would silently build a different
; kernel from every other env.
;   pio run -e x4pro-combo -t upload
[env:x4pro-combo]
; env:x4pro for the board/flags, firmware_tuned ONLY for its
; custom_component_remove list: this env rebuilds the Arduino core (see
; custom_sdkconfig below), and a rebuild that still carries esp_insights /
; esp_rainmaker fails with "https_server.crt.S not found". Upstream #3203 moved
; that list out of [base] into [firmware_tuned], which [env:x4pro] deliberately
; does not inherit -- so this env has to name it. custom_sdkconfig and
; lib_ignore are set below and therefore REPLACE whatever either parent had;
; custom_component_remove is not set here, so it inherits cleanly.
extends = env:x4pro, firmware_tuned
; Back to the board default. [env:x4pro] overrides it to dio_opi purely to get
; the prebuilt Arduino core whose TinyUSB component USB Drive needs; this env
; rebuilds the core from custom_sdkconfig below and carries no USB-MSC, so the
; override buys nothing here and would change the kernel base this image is
; built from -- and the kernel base is exactly what the hardware-validated
; r2 build used (the board default, before #3203 added the override).
board_build.arduino.memory_type = qio_opi
; IROM lever (2026-09-02, r3): the framework compiles app code with
; -fno-jump-tables -fno-tree-switch-conversion; unflagging them lets switch
; dispatch compile to .rodata jump tables (DROM — free budget) instead of
; .text compare chains. Hazard checked: no IRAM_ATTR function in app or SDK
; contains a switch, so no flash-cache-disabled path can touch a table.
; build_unflags REPLACES the inherited [base] list, so it is repeated here.
build_unflags =
  ${base.build_unflags}
  -fno-jump-tables
  -fno-tree-switch-conversion
; IROM lever (2026-09-03, r3): drop the stack-protector canaries from the APP
; SOURCES ONLY. The framework compiles every project translation unit with
; -fstack-protector (CONFIG_COMPILER_STACK_CHECK_MODE_NORM in the prebuilt
; sdkconfig, emitted into CCFLAGS by pioarduino-build.py), which costs a guard
; load, a frame slot and an epilogue compare in every function that holds an
; array. build_src_flags reaches src/ alone and lands AFTER the framework's
; flag, so the later -fno- wins.
;
; SCOPED TO src/ ON PURPOSE, not to the whole compile: lib_deps and the IDF
; core keep their canaries, which leaves the untrusted-input parsers that are
; NOT ours (wolfSSL, expat, PNGdec, JPEGDEC, SdFat) and the whole network stack
; protected. __stack_chk_fail stays linked for them.
;
; Measured on x4pro-combo-pmstats with esptool elf2image + image_info on the
; freshly linked firmware.elf (segment at load addr 0x42000020; the cliff is
; 0x1C0000) -- never from .pio/build/*/firmware.bin, which the build cache
; restores stale. Bracketed figure is the headroom left, (0x1C0000 - addr):
;
;   env      with canaries         without (this flag)     delta
;   pmstats  0x1bf7d0 ( 2,096 B)   0x1b9bf0 (25,616 B)   -23,520 B
;   combo    0x1bf27c ( 3,460 B)   0x1b9680 (27,008 B)   -23,548 B
;
; 0x1C0000 - 0x1b9bf0 = 0x6410 = 25,616 B = 25.02 KiB (pmstats)
; 0x1C0000 - 0x1b9680 = 0x6980 = 27,008 B = 26.38 KiB (combo)
;
; SECURITY TRADEOFF -- accepted by the owner 2026-09-03 (src/-only scope
; chosen over the wider lib/ variant for exactly this reason). A stack-buffer
; overflow in a src/ TU now corrupts the frame silently instead of tripping
; __stack_chk_fail and panicking. src/ is the app layer -- activities, main,
; settings/JSON stores, CrossPointWebServer, OtaUpdater -- NOT the content
; parsers: lib/Epub (EPUB/HTML/CSS), lib/RssParser, lib/OpdsParser, expat,
; the image codecs and wolfSSL all live outside src/ and KEEP their
; canaries, per the scoping above. Canaries detect bugs, they do not
; implement behaviour, so nothing else about the image changes. Reverting is
; deleting these two lines.
;
; COMBO-ONLY, and it must stay that way: x4pro, x4c, default, gh_release and
; every other env keep -fstack-protector. None of them is near the cliff, so
; none of them pays this to buy anything.
;
; LEVERS TESTED THE SAME DAY THAT MEASURED 0 B OR WORSE on this toolchain
; (xtensa-esp-elf GCC 14.2.0, GNU ld 2.43.1) -- do not re-try them:
;   -Oz in place of -Os     0 B. GCC's -Oz has no Xtensa back-end effect:
;                           four real TUs compiled both ways produced
;                           byte-identical .text, and a full combo-scoped link
;                           came back at exactly 0x1bf7d0, the -Os figure.
;   -fno-unwind-tables      0 B. .eh_frame is already empty under
;                           -fno-exceptions; there is nothing to remove.
;   -Wl,--icf=safe          Unsupported. The linker is GNU ld (bfd); identical
;                           code folding exists only in gold and lld.
;   -fno-reorder-blocks     -152 B over 8 TUs, and it is a speed regression.
;   -fno-devirtualize       -131 B over 8 TUs.
;   -fno-guess-branch-prob  +298 B (worse).
;   -fmerge-all-constants   0 B of .text (it moves 124 KB of DROM, which does
;                           not count against the cliff) and it is not
;                           conforming for C++.
build_src_flags =
  -fno-stack-protector
; REPLACES [base] lib_ignore (BLE), so repeat it. ESPmDNS: see the
; CROSSPOINT_NO_MDNS comment in [combo_flags] — the LDF links the wrapper on
; the textual #include even though the include is #ifndef'd out.
lib_ignore =
  BLE
  ESPmDNS
; Error-only logging, same as the pmstats variant (was info until the
; 2026-08-25 develop rebase — see the LOG_LEVEL=0 comment below). Anything
; info/debug-level is checked against a dev x4pro build instead. Composed from
; the shared sections rather than inheriting env:x4pro, whose debug log level
; cannot be value-overridden (component builds harvest -D only).
build_flags =
  ${base.build_flags}
  ${x4pro_flags.common}
  ; Error-only logging: the 2026-08-25 develop rebase brought ~13 KB of new
  ; upstream .text (#3156 control center, #2654 tables, #3175) and pushed both
  ; combo images ~10-11 KB past the 0x1C0000 mapping cliff at LOG_LEVEL=1.
  ; Dropping LOG_INF is the first lever on the recorded list (debug-level work
  ; goes against a dev x4pro build; CMD:/LSSTATS use logSerial directly and
  ; keep working). VERIFY IROM < 0x1C0000 after any change here.
  -DLOG_LEVEL=0
  ${combo_flags.features}
custom_sdkconfig =
  ; --- verbatim copy of [base] custom_sdkconfig (see its comments there) ---
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
  ; --- new for this env ---
  ; esp_pm_configure() fails without both of these, and HalPowerManager then
  ; degrades to a logged no-op with no DFS at all — they ship with the flag.
  CONFIG_PM_ENABLE=y
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
  ; The USB-Serial-JTAG driver holds a no-light-sleep lock while a host is
  ; enumerated, so an attached console keeps working (a sleep window drops the
  ; CDC link). This is the load-bearing USB guard on the X4 Pro, whose board
  ; profile leaves usbDetect unassigned — power measurements must be taken
  ; DETACHED, because sleep is suppressed by design while plugged in.
  CONFIG_USJ_NO_AUTO_LS_ON_CONNECTION=y

; x4pro-combo plus CONFIG_PM_PROFILING and the CROSSPOINT_PM_STATS serial dump:
; CMD:PMSTATS (or a 60 s auto-print while a host is attached) reports esp_pm's
; cumulative mode/lock residency. Measurement builds only — profiling adds a
; small bookkeeping cost to every lock operation.
[env:x4pro-combo-pmstats]
extends = env:x4pro-combo
; Inherits the combo flag set (already info-level logging) and adds the
; CMD:PMSTATS instrumentation. VERIFY after any change to either combo env:
; esptool image_info -- the IROM segment (load addr 0x42000020; its number
; shifts between builds) must stay < 0x1C0000, the vendor bootloader mapping
; cliff past which images do not boot (bisected + boot-confirmed 2026-08-20).
build_flags =
  ${env:x4pro-combo.build_flags}
  -DCROSSPOINT_PM_STATS
custom_sdkconfig =
  ; --- verbatim copy of [env:x4pro-combo] custom_sdkconfig (it REPLACES, not
  ; --- extends; see the comments there) ---
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
  CONFIG_PM_ENABLE=y
  CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
  CONFIG_USJ_NO_AUTO_LS_ON_CONNECTION=y
  ; --- new for this env ---
  ; Compiles the esp_pm light-sleep enter/exit callback machinery the LSSTATS
  ; residency counters register against. KERNEL-CONFIG EXPERIMENT: kernel
  ; option changes have boot-failed before (see CONFIG_PM_PROFILING below) --
  ; always flash-test after touching this block.
  CONFIG_PM_LIGHT_SLEEP_CALLBACKS=y
  ; CONFIG_PM_PROFILING=y is DISABLED pending diagnosis: kernels built with it
  ; consistently fail to boot through the vendor boot chain ("Invalid app image
  ; header" from cpu_start's header-relocation check), while byte-equivalent
  ; kernels without it boot. Bisected 2026-08-20; mechanism unexplained. The
  ; CMD:PMSTATS dump degrades to the lock table (no mode/residency rows);
  ; app-level residency counters are the replacement path if needed.

; --- M5Stack Paper Mono — ESP32-S3, SSD1683 800x480 + FT6336 touch + frontlight
; Power/reset plumbing runs through the M5PM1 PMIC and M5IOE1 expander; the SDK
; sequences them itself. Touch, frontlight, RTC, and other capabilities are
; selected by the Paper Mono BoardConfig profile.
; Extends base (not firmware_tuned): USB Drive needs the prebuilt dio_opi
; Arduino variant, whose TinyUSB component is enabled for CDC and MSC.
;   pio run -e papermono -t upload
[env:papermono]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_PAPERMONO=1
  -DFREEINK_CAP_USB_MSC=1
  ; The SSD1683 grayscale target planes are batched in PSRAM.
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_Paper_Mono\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-papermono\"
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2
  ; Native 1-bit SDMMC is mounted through SdFat's block-device interface.
  -DUSE_BLOCK_DEVICE_INTERFACE=1

