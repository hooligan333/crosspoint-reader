  ; Costs 2184 B of IROM (esptool image_info, segment at load addr 0x42000020;
  ; the cliff is 0x1C0000), measured on this commit with full builds. The
  ; bracketed figure is the headroom left, (0x1C0000 - addr) / 1024:
